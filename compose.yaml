services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      DATABASE_PATH: /app/data/chat.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      OPENLLM_API_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
